name: Prediction checks

on: [push, pull_request]

jobs:
  inference:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      OMP_NUM_THREADS: "2"
      MKL_THREADING_LAYER: SEQUENTIAL
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy==1.26.4
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -B -m unittest discover -s tests -p test_prediction.py -v
      - run: python -B tests/smoke_pretrained.py
      - run: python -B predict.py --demo --output demo_waveform.npz
